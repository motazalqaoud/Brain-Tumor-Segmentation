<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img"
     aria-label="The three BraTS regions are nested: Enhancing Tumor inside Tumor Core inside Whole Tumor.">
  <rect width="880" height="340" rx="10" fill="#f7f9fc"/>

  <text x="28" y="34" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="16" font-weight="600" fill="#1b2430">The three regions are nested, not mutually exclusive</text>
  <text x="28" y="56" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="13" fill="#5b6672">This is why the model predicts 3 independent channels with a sigmoid, not 4 classes with a softmax.</text>

  <!-- nested circles -->
  <g transform="translate(40,80)">
    <circle cx="150" cy="115" r="112" fill="#f2c94c" fill-opacity="0.45" stroke="#d3a51d" stroke-width="2"/>
    <circle cx="150" cy="125" r="74"  fill="#f2994a" fill-opacity="0.55" stroke="#c9762a" stroke-width="2"/>
    <circle cx="150" cy="140" r="38"  fill="#eb5757" fill-opacity="0.70" stroke="#b83232" stroke-width="2"/>

    <text x="150" y="28" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="13" font-weight="700" fill="#7a5c00">WT · Whole Tumor</text>
    <text x="150" y="80" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="13" font-weight="700" fill="#8a4a13">TC · Tumor Core</text>
    <text x="150" y="146" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="13" font-weight="700" fill="#ffffff">ET</text>
  </g>

  <!-- label arithmetic -->
  <g transform="translate(360,92)" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <rect x="0" y="0" width="490" height="52" rx="8" fill="#fdf6dc" stroke="#d3a51d"/>
    <text x="16" y="22" font-size="13.5" font-weight="700" fill="#7a5c00">WT · Whole Tumor</text>
    <text x="16" y="40" font-size="12.5" fill="#5b6672">everything abnormal — necrotic core + enhancing + edema · labels 1 + 2 + 4</text>

    <rect x="0" y="64" width="490" height="52" rx="8" fill="#fdeee0" stroke="#c9762a"/>
    <text x="16" y="86" font-size="13.5" font-weight="700" fill="#8a4a13">TC · Tumor Core</text>
    <text x="16" y="104" font-size="12.5" fill="#5b6672">necrotic core + enhancing tumor · labels 1 + 4</text>

    <rect x="0" y="128" width="490" height="52" rx="8" fill="#fdeaea" stroke="#b83232"/>
    <text x="16" y="150" font-size="13.5" font-weight="700" fill="#9c2a2a">ET · Enhancing Tumor</text>
    <text x="16" y="168" font-size="12.5" fill="#5b6672">actively enhancing tissue only · label 4 — the smallest and hardest region</text>
  </g>

  <text x="28" y="322" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="12" fill="#5b6672">ET ⊂ TC ⊂ WT. Each voxel can belong to several regions at once, which is exactly how the official BraTS leaderboard scores submissions.</text>
</svg>
